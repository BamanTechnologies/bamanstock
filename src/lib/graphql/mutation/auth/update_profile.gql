mutation updateProfile(
  $id: uuid!
  $object: account_users_set_input!
  $investorId: uuid!
  $investorProfile: investor_set_input!
) {
  update_profile: update_account_users_by_pk(
    pk_columns: { id: $id }
    _set: $object
  ) {
    id
  }
  update_investor: update_investor_by_pk(
    pk_columns: { id: $investorId }
    _set: $investorProfile
  ) {
    id
  }
}
