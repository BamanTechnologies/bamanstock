mutation archiveProduct($id: uuid!, $isDeleted: Boolean!) {
  update_products(where: { id: { _eq: $id } }, _set: { is_deleted: $isDeleted }) {
    affected_rows
  }
  update_stock(where: { product_id: { _eq: $id } }, _set: { is_deleted: $isDeleted }) {
    affected_rows
  }
  update_stock_movements(
    where: { product_id: { _eq: $id } }
    _set: { is_deleted: $isDeleted }
  ) {
    affected_rows
  }
  update_order_items(where: { product_id: { _eq: $id } }, _set: { is_deleted: $isDeleted }) {
    affected_rows
  }
  update_order_item_batches(
    where: { order_item: { product_id: { _eq: $id } } }
    _set: { is_deleted: $isDeleted }
  ) {
    affected_rows
  }
  update_orders(
    where: { order_items: { product_id: { _eq: $id } } }
    _set: { is_deleted: $isDeleted }
  ) {
    affected_rows
  }
  update_stock_transfer_batches(
    where: { stockByStock: { product_id: { _eq: $id } } }
    _set: { is_deleted: $isDeleted }
  ) {
    affected_rows
  }
  update_stock_transfers(
    where: { stock_transfer_batches: { stockByStock: { product_id: { _eq: $id } } } }
    _set: { is_deleted: $isDeleted }
  ) {
    affected_rows
  }
}