query getProfile($id: uuid!) {
  profile: account_users_by_pk(id: $id) {
    id
    first_name
    last_name
    email
    phone
    profile_picture
    investors {
      id
      first_name
      last_name
      phone_number
      address
      company_investors {
        company: companyByCompany {
          id
          name
        }
      }
    }
  }
}
