query salesReportStat(
  $pastMonthEndDate: timestamptz!
  $paymentFilter: payment_bool_exp!
  $ordersFilter: orders_bool_exp!
) {
  total_sales: payment_aggregate(
    where: { _and: [{ order: { status: { _neq: "cancelled" } } }, $paymentFilter] }
  ) {
    aggregate {
      sum {
        amount
      }
    }
  }
  previous_month_sales: payment_aggregate(
    where: {
      _and: [
        { created_at: { _lte: $pastMonthEndDate } }
        { order: { status: { _neq: "cancelled" } } }
        $paymentFilter
      ]
    }
  ) {
    aggregate {
      sum {
        amount
      }
    }
  }
  total_orders: orders_aggregate(where: $ordersFilter) {
    aggregate {
      count
    }
  }
  previous_month_orders: orders_aggregate(
    where: { _and: [{ created_at: { _lte: $pastMonthEndDate } }, $ordersFilter] }
  ) {
    aggregate {
      count
    }
  }
  total_transactions: payment_aggregate(where: $paymentFilter) {
    aggregate {
      count
    }
  }
  previous_month_transactions: payment_aggregate(
    where: { _and: [{ created_at: { _lte: $pastMonthEndDate } }, $paymentFilter] }
  ) {
    aggregate {
      count
    }
  }
  total_units_sold: orders_aggregate(
    where: { _and: [{ status: { _neq: "cancelled" } }, $ordersFilter] }
  ) {
    aggregate {
      sum {
        order_quantity
      }
    }
  }
  previous_month_units: orders_aggregate(
    where: {
      _and: [
        { created_at: { _lte: $pastMonthEndDate } }
        { status: { _neq: "cancelled" } }
        $ordersFilter
      ]
    }
  ) {
    aggregate {
      sum {
        order_quantity
      }
    }
  }
}