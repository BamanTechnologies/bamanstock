query GetDashboardStats(
  $pastMonthEndDate: timestamptz!
  $ordersFilter: orders_bool_exp = {}
) {
  total_sales: payment_aggregate(
    where: {
      order: { _and: [{ status: { _neq: "cancelled" } }, $ordersFilter] }
    }
  ) {
    aggregate {
      sum {
        amount
      }
    }
  }
  previous_month_sales: payment_aggregate(
    where: {
      created_at: { _lte: $pastMonthEndDate }
      order: { _and: [{ status: { _neq: "cancelled" } }, $ordersFilter] }
    }
  ) {
    aggregate {
      sum {
        amount
      }
    }
  }
  total_orders: orders_aggregate(where: $ordersFilter) {
    aggregate {
      count
    }
  }
  previous_month_orders: orders_aggregate(
    where: {
      _and: [{ created_at: { _lte: $pastMonthEndDate } }, $ordersFilter]
    }
  ) {
    aggregate {
      count
    }
  }
  total_merchants: merchant_aggregate {
    aggregate {
      count
    }
  }
  previous_month_merchants: merchant_aggregate(
    where: { created_at: { _lte: $pastMonthEndDate } }
  ) {
    aggregate {
      count
    }
  }
  total_units_sold: orders_aggregate(
    where: { _and: [{ status: { _neq: "cancelled" } }, $ordersFilter] }
  ) {
    aggregate {
      sum {
        order_quantity
      }
    }
  }
  previous_month_units: orders_aggregate(
    where: {
      _and: [
        { created_at: { _lte: $pastMonthEndDate } }
        { status: { _neq: "cancelled" } }
        $ordersFilter
      ]
    }
  ) {
    aggregate {
      sum {
        order_quantity
      }
    }
  }
}