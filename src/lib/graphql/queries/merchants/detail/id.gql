query getMerchantDetail($id: uuid!) {
  merchant_by_pk(id: $id) {
    id
    first_name
    last_name
    phone_number
    address
    created_at
    total_transactions: payments_aggregate(
      where: { order: { is_deleted: { _eq: false } } }
    ) {
      aggregate {
        sum {
          amount
        }
      }
    }
    total_revenue: payments_aggregate(
      where: {
        _and: [
          { order: { status: { _eq: "paid" } } }
          { order: { is_deleted: { _eq: false } } }
        ]
      }
    ) {
      aggregate {
        sum {
          amount
        }
      }
    }
    stocks_aggregate(where: { is_deleted: { _eq: false } }) {
      aggregate {
        sum {
          purchased_price
        }
      }
    }
    branch: branchByBranch {
      id
      name
      company: companyByCompany {
        id
        name
      }
    }
  }
  stock_movements_aggregate(
    where: {
      _and: [
        { is_deleted: { _eq: false } }
        {
          _or: [
            { created_by: { _eq: $id } }
            { branch: { merchants: { id: { _eq: $id } } } }
          ]
        }
      ]
    }
  ) {
    aggregate {
      sum {
        quantity_delta
      }
    }
  }
  products_aggregate(
    where: {
      _and: [
        { created_by: { _eq: $id } }
        { is_deleted: { _eq: false } }
      ]
    }
  ) {
    aggregate {
      count
    }
  }
}
